<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento SUS - Região de Patrocínio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agendamento Digital - SUS</h1>
        <p>Marque sua consulta de forma rápida e fácil.</p>
        <div style="margin-top: 15px;">
            <a href="admin.html" style="color: #cce5ff; text-decoration: underline; font-size: 14px;">Área do Controlador (ADMIN)</a>
        </div>
    </header>

    <main>
        <section id="area-agendamento">
            <h2>Nova Consulta</h2>
            <form id="form-agendamento">
                <label for="cpf">CPF (Apenas números):</label>
                <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>

                <label for="local">Local de Atendimento (UBS):</label>
                <select id="local" required>
                    <option value="" disabled selected>Selecione a unidade...</option>
                    <option value="UBS Morada Nova - Patrocínio">UBS Morada Nova - Patrocínio</option>
                    <option value="UBS Enéas - Patrocínio">UBS Enéas - Patrocínio</option>
                    <option value="UBS Centro - Guimarânia">UBS Centro - Guimarânia</option>
                    <option value="UBS Centro - Serra do Salitre">UBS Centro - Serra do Salitre</option>
                </select>

                <label for="especialidade">Especialidade:</label>
                <select id="especialidade" required>
                    <option value="" disabled selected>Selecione a especialidade...</option>
                    <option value="Clínico Geral">Clínico Geral</option>
                    <option value="Pediatria">Pediatria</option>
                    <option value="Ginecologia e Obstetrícia">Ginecologia e Obstetrícia</option>
                    <option value="Odontologia">Odontologia</option>
                    <option value="Psicologia">Psicologia</option>
                    <option value="Fisioterapia">Fisioterapia</option>
                    <option value="Nutrição">Nutrição</option>
                    <option value="Sala de Vacina">Sala de Vacina</option>
                </select>

                <div class="linha-tempo">
                    <div>
                        <label for="data">Data:</label>
                        <input type="date" id="data" required>
                    </div>
                    <div>
                        <label for="horario">Horário:</label>
                        <select id="horario" required>
                            <option value="" disabled selected>Selecione a data primeiro...</option>
                        </select>
                    </div>
                </div>

                <button type="submit">Agendar Consulta</button>
            </form>
        </section>

        <section id="area-visualizacao">
            <h2>Meus Agendamentos</h2>
            <div class="busca-cpf">
                <input type="text" id="cpf-busca" maxlength="14" placeholder="Digite seu CPF para buscar">
                <button onclick="buscarAgendamentos()" style="margin-top: 10px;">Buscar</button>
            </div>
            <div id="lista-agendamentos"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
