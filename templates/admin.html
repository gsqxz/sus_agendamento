<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADMIN - SUS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Painel do Controlador - UBS</h1>
        <div style="margin-top: 15px;">
            <a href="index.html" style="color: #cce5ff; text-decoration: underline; font-size: 14px;">Voltar para Marcação de Consultas</a>
        </div>
    </header>
    <main style="max-width: 900px;">
        <section id="login-section" style="max-width: 400px; margin: 0 auto;">
            <h2>Acesso Restrito</h2>
            <p style="margin-bottom: 15px; font-size: 14px;">Insira suas credenciais governamentais.</p>
            <input type="text" id="usuario" placeholder="Usuário">
            <input type="password" id="senha" placeholder="Senha">
            <button onclick="fazerLogin()">Entrar no Sistema</button>
        </section>

        <section id="dashboard-section" style="display: none;">
            <h2>Todos os Agendamentos do Sistema</h2>
            <button onclick="carregarTodos()" style="margin-bottom: 15px; max-width: 200px;">Atualizar Tabela</button>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>CPF</th>
                            <th>Local</th>
                            <th>Especialidade</th>
                            <th>Data</th>
                            <th>Horário</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        async function fazerLogin() {
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                if (res.ok) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    carregarTodos();
                } else {
                    alert("Usuário ou senha incorretos.");
                }
            } catch (error) {
                alert("Erro de conexão com o servidor.");
            }
        }

        async function carregarTodos() {
            try {
                const res = await fetch(`${API_URL}/admin/todos`);
                const dados = await res.json();
                const tbody = document.getElementById('tabela-corpo');
                tbody.innerHTML = '';

                dados.forEach(a => {
                    const dataFormatada = a.data_consulta.split('-').reverse().join('/');
                    const horarioFormatado = a.horario.substring(0, 5);
                    const corStatus = a.status === 'Cancelado' ? 'color: #dc3545;' : 'color: #28a745;';

                    tbody.innerHTML += `
                        <tr>
                            <td>${a.id}</td>
                            <td>${a.cpf}</td>
                            <td>${a.local}</td>
                            <td>${a.especialidade}</td>
                            <td>${dataFormatada}</td>
                            <td>${horarioFormatado}</td>
                            <td style="font-weight: bold; ${corStatus}">${a.status}</td>
                        </tr>
                    `;
                });
            } catch(error) {
                alert("Erro ao carregar os dados.");
            }
        }
    </script>
</body>
</html>
